name: Deploy private HF Space

on:
  push:
    branches: [hf-space-docker]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments; do not interrupt an in-progress Space update.
concurrency:
  group: s1mb-hf-space
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      S1MB_TEST_NO_DATASET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          python-version: '3.11'
      - run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: viewer
      - run: uv sync --locked && uv run tox
        working-directory: evaluator
      - run: uv run pytest ../deploy/hf-space/test_deploy.py
        working-directory: evaluator
      - run: uv run ruff check ../deploy/hf-space
        working-directory: evaluator
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: viewer/Dockerfile
          target: space
          load: true
          tags: s1mb-space:test
          cache-from: type=gha,scope=space
          cache-to: type=gha,scope=space,mode=max
      - name: Check runtime dependencies without credentials or data
        run: |
          docker run --rm --workdir /app/viewer --entrypoint node s1mb-space:test -e 'require("next"); require("tsx")'
          docker run --rm --entrypoint xz s1mb-space:test --version

  publish-and-deploy:
    needs: validate
    # Undecided destinations disable publication, while validation still runs.
    if: >-
      github.ref == 'refs/heads/hf-space-docker' &&
      vars.S1MB_SPACE_REPO != '' && vars.S1MB_SPACE_IMAGE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          python-version: '3.11'
      - run: uv sync --locked --no-dev
        working-directory: evaluator
      - name: Check private Space configuration before publishing
        working-directory: evaluator
        env:
          HF_TOKEN: ${{ secrets.S1MB_SPACE_DEPLOY_TOKEN }}
          S1MB_SPACE_REPO: ${{ vars.S1MB_SPACE_REPO }}
          S1MB_SPACE_IMAGE: ${{ vars.S1MB_SPACE_IMAGE }}
        run: |
          uv run --no-dev python - <<'PY'
          import os, runpy
          from huggingface_hub import HfApi
          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("Configure the Space deployment secret")
          module = runpy.run_path("../deploy/hf-space/deploy.py")
          module["payload"](os.environ["S1MB_SPACE_IMAGE"] + "@sha256:" + "0" * 64, os.environ["GITHUB_SHA"], [])
          module["check_space"](HfApi(), os.environ["S1MB_SPACE_REPO"])
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: viewer/Dockerfile
          target: space
          push: true
          tags: ${{ vars.S1MB_SPACE_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=space
      - name: Check anonymous image access
        env:
          IMAGE: ${{ vars.S1MB_SPACE_IMAGE }}@${{ steps.image.outputs.digest }}
        run: |
          registry_config=$(mktemp -d)
          trap 'rm -rf "$registry_config"' EXIT
          docker --config "$registry_config" manifest inspect "$IMAGE" > /dev/null
      - name: Deploy digest and verify the private Space
        working-directory: evaluator
        env:
          HF_TOKEN: ${{ secrets.S1MB_SPACE_DEPLOY_TOKEN }}
          S1MB_SPACE_REPO: ${{ vars.S1MB_SPACE_REPO }}
          IMAGE: ${{ vars.S1MB_SPACE_IMAGE }}@${{ steps.image.outputs.digest }}
        run: >-
          uv run --no-dev python ../deploy/hf-space/deploy.py
          --space "$S1MB_SPACE_REPO" --image "$IMAGE"
          --source-sha "$GITHUB_SHA" --deploy
